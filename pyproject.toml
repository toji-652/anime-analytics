[project]
name = "anime-analytics"
version = "0.1.0"
description = "End-to-end anime analytics platform and hybrid recommendation engine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "psycopg2-binary>=2.9.9",
    "implicit>=0.7.2",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.35.0",
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "dbt-core>=1.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = [
    "BLE001",  # Do not catch blind exception
    "S110",    # try-except-pass
    "DTZ001",  # datetime without tzinfo
    "DTZ005",  # datetime now without tz
    "PLW1510", # subprocess.run check=False
    "SIM117",  # nested with statements
    "SIM102",  # nested if statements
    "B019",    # lru_cache on method
    "SIM113",  # enumerate for index
    "UP017",   # datetime.UTC
    "F841"     # unused local variable
]
