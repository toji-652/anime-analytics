name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          uv run ruff check .

      - name: Run Pytest Test Suite
        run: |
          uv run pytest

      - name: Parse dbt Project Manifest
        run: |
          cd warehouse && uv run dbt parse
